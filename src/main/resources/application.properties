spring.application.name=management-system
spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/db-management}
spring.datasource.username=  ${DB_USERNAME:postgres}
spring.datasource.password= ${DB_PASSWORD:Work@1234567890}
spring.datasource.driver-class-name= org.postgresql.Driver

server.port = 6780
# spring.profiles.active=prod

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update



# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
jwt.expiration=3600000